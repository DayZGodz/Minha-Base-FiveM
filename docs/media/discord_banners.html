<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GODZ Discord Banners</title>
    <style>
        :root {
            --godz-primary: #9b59b6;
            --godz-secondary: #8e44ad;
            --godz-accent: #00e5ff;
            --godz-success: #2ecc71;
            --godz-danger: #e74c3c;
            --godz-warning: #f1c40f;
            --godz-glass-bg: rgba(20, 20, 20, 0.85);
            --godz-glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            gap: 30px;
        }

        .banner-container {
            width: 800px;
            height: 200px;
            background: linear-gradient(135deg, #101010, #1a1a1a);
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .glass-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 20%, rgba(155, 89, 182, 0.15), transparent 50%);
            z-index: 1;
        }

        .banner-content {
            z-index: 2;
        }

        .banner-title {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: white;
            text-shadow: 0 0 20px var(--godz-primary);
        }

        .banner-subtitle {
            font-size: 1.2rem;
            color: var(--godz-accent);
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .banner-icon {
            font-size: 5rem;
            color: rgba(255,255,255,0.1);
            z-index: 1;
        }

        /* Variants */
        .status { border-bottom: 4px solid var(--godz-success); }
        .status .banner-title { text-shadow: 0 0 20px var(--godz-success); }
        .status .banner-subtitle { color: var(--godz-success); }

        .police { border-bottom: 4px solid #3498db; }
        .police .banner-title { text-shadow: 0 0 20px #3498db; }
        .police .banner-subtitle { color: #3498db; }

        .ems { border-bottom: 4px solid var(--godz-danger); }
        .ems .banner-title { text-shadow: 0 0 20px var(--godz-danger); }
        .ems .banner-subtitle { color: var(--godz-danger); }

        .crime { border-bottom: 4px solid #7f8c8d; }
        .crime .banner-title { text-shadow: 0 0 20px #7f8c8d; }
        .crime .banner-subtitle { color: #bdc3c7; }

    </style>
</head>
<body>

    <!-- STATUS BANNER -->
    <div class="banner-container status">
        <div class="glass-overlay"></div>
        <div class="banner-content">
            <div class="banner-title">GODZ RP</div>
            <div class="banner-subtitle">STATUS DO SERVIDOR</div>
        </div>
        <div class="banner-icon">🟢</div>
    </div>

    <!-- POLICE BANNER -->
    <div class="banner-container police">
        <div class="glass-overlay"></div>
        <div class="banner-content">
            <div class="banner-title">L.S.P.D</div>
            <div class="banner-subtitle">DEPARTAMENTO DE POLÍCIA</div>
        </div>
        <div class="banner-icon">🚓</div>
    </div>

    <!-- EMS BANNER -->
    <div class="banner-container ems">
        <div class="glass-overlay"></div>
        <div class="banner-content">
            <div class="banner-title">S.A.M.U</div>
            <div class="banner-subtitle">SERVIÇO MÉDICO</div>
        </div>
        <div class="banner-icon">🚑</div>
    </div>

    <!-- CRIME BANNER -->
    <div class="banner-container crime">
        <div class="glass-overlay"></div>
        <div class="banner-content">
            <div class="banner-title">ILLEGAL</div>
            <div class="banner-subtitle">ÁREA RESTRITA</div>
        </div>
        <div class="banner-icon">🏴</div>
    </div>

</body>
</html>
