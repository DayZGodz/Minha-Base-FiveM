<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Unity Factions</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- Optional for icons -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app" style="display: none;">
        <div class="container">
            <header>
                <h1 id="faction-name">NOME DA FACÇÃO</h1>
                <div class="hire-controls">
                    <input type="number" id="hire-id" placeholder="ID do Passaporte">
                    <button id="btn-hire">CONTRATAR</button>
                </div>
            </header>
            
            <div class="members-list">
                <div class="list-header">
                    <span>ID</span>
                    <span>NOME</span>
                    <span>CARGO</span>
                    <span>FARM (ITENS)</span>
                    <span>AÇÕES</span>
                </div>
                <div id="members-container">
                    <!-- Members injected via JS -->
                </div>
            </div>
            
            <button class="close-btn" onclick="closeMenu()">FECHAR</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
