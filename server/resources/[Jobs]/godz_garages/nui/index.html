<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>GODZ Garage</title>
</head>
<body>
    <div id="app" class="container hidden">
        <div class="header">
            <div class="title">
                <i class="fas fa-warehouse"></i>
                <span>GODZ <span class="highlight">GARAGE</span></span>
            </div>
            <div class="subtitle" id="garage-name">Central</div>
        </div>

        <div class="vehicle-list" id="vehicle-list">
            <!-- Cards Injected by JS -->
        </div>

        <div class="footer">
            <p>Pressione <span class="key">ESC</span> para fechar</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
