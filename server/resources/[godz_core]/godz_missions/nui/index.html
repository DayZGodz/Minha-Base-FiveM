<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godz Missions UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Hack UI -->
    <div id="hack-container" style="display: none; position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); width: 400px; background: rgba(0,0,0,0.8); border: 2px solid #00ffcc; padding: 20px; color: white; font-family: 'Courier New', Courier, monospace;">
        <div style="text-align: center; margin-bottom: 10px; color: #00ffcc; font-weight: bold; font-size: 20px;">
            <i class="fas fa-terminal"></i> NEXUS DECRYPTION
        </div>
        <div style="width: 100%; height: 20px; background: #333; border: 1px solid #555;">
            <div id="hack-bar-fill" style="width: 0%; height: 100%; background: #ff0000; transition: width 0.1s;"></div>
        </div>
        <div style="text-align: center; margin-top: 5px; font-size: 12px; color: #aaa;">
            MANTENHA VELOCIDADE > 80 KM/H
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
