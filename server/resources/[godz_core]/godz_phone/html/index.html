<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God-Phone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" v-if="visible">
        <div class="phone-case">
            <div class="notch"></div>
            <div class="screen">
                <!-- Status Bar -->
                <div class="status-bar">
                    <span>12:00</span>
                    <div class="icons">
                        <i class="fas fa-signal"></i>
                        <i class="fas fa-wifi"></i>
                        <i class="fas fa-battery-full"></i>
                    </div>
                </div>

                <!-- Home Screen -->
                <div class="home-screen" v-if="currentApp === null">
                    <div class="app-grid">
                        <div class="app-icon" @click="openApp('ai')">
                            <div class="icon-bg ai-bg"><i class="fas fa-robot"></i></div>
                            <span>God AI</span>
                        </div>
                        <div class="app-icon" @click="openApp('contacts')">
                            <div class="icon-bg contact-bg"><i class="fas fa-address-book"></i></div>
                            <span>Contatos</span>
                        </div>
                        <div class="app-icon">
                            <div class="icon-bg settings-bg"><i class="fas fa-cog"></i></div>
                            <span>Ajustes</span>
                        </div>
                        <!-- Add more apps here -->
                    </div>
                </div>

                <!-- App: God Assistant (AI) -->
                <div class="app-window ai-app" v-if="currentApp === 'ai'">
                    <div class="app-header">
                        <button @click="closeApp"><i class="fas fa-chevron-left"></i></button>
                        <span>God Assistant</span>
                    </div>
                    <div class="chat-area" id="chatArea">
                        <div class="message system">
                            Olá! Sou a IA da Familía God. Pergunte sobre economia, regras ou peça ajuda!
                        </div>
                        <div v-for="(msg, index) in aiMessages" :key="index" :class="['message', msg.type]">
                            {{ msg.text }}
                        </div>
                        <div v-if="isAiThinking" class="message system typing">Digitando...</div>
                    </div>
                    <div class="input-area">
                        <input type="text" v-model="aiInput" @keyup.enter="sendToAi" placeholder="Pergunte algo...">
                        <button @click="sendToAi"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- App: Contacts -->
                <div class="app-window" v-if="currentApp === 'contacts'">
                    <div class="app-header">
                        <button @click="closeApp"><i class="fas fa-chevron-left"></i></button>
                        <span>Contatos</span>
                        <button @click="showAddContact = true"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="contact-list">
                        <div v-for="contact in contacts" :key="contact.id" class="contact-item">
                            <div class="avatar">{{ contact.name.charAt(0) }}</div>
                            <div class="info">
                                <div class="name">{{ contact.name }}</div>
                                <div class="number">{{ contact.number }}</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Add Contact Modal -->
                    <div class="modal" v-if="showAddContact">
                        <h3>Novo Contato</h3>
                        <input v-model="newContact.name" placeholder="Nome">
                        <input v-model="newContact.number" placeholder="Número">
                        <div class="modal-buttons">
                            <button @click="showAddContact = false">Cancelar</button>
                            <button @click="addContact">Salvar</button>
                        </div>
                    </div>
                </div>

                <!-- Bottom Bar -->
                <div class="bottom-bar" @click="closeApp"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
