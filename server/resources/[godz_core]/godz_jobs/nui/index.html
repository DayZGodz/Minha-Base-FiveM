<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GODZ Jobs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Menu de Seleção -->
        <div id="job-menu" class="container" style="display: none;">
            <div class="glass-background"></div>
            
            <header>
                <div class="brand">
                    <i class="fas fa-briefcase brand-icon"></i>
                    <div class="brand-text">
                        <h1>GODZ</h1>
                        <span>WORK CENTER</span>
                    </div>
                </div>
                <button class="close-btn" onclick="closeMenu()">
                    <i class="fas fa-times"></i>
                </button>
            </header>
            
            <main class="jobs-grid" id="jobs-container">
                <!-- Injetado via JS -->
            </main>
        </div>

        <!-- HUD de Progresso -->
        <div id="job-hud" class="hud-container" style="display: none;">
            <div class="hud-glass">
                <div class="hud-header">
                    <i class="fas fa-tasks"></i>
                    <span id="hud-job-name">EMPREGO ATUAL</span>
                </div>
                <div class="hud-context">
                    <p id="hud-context-text">Aguardando instruções da IA...</p>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-bar">
                        <div id="hud-progress-fill" class="fill" style="width: 0%"></div>
                    </div>
                    <span id="hud-progress-text">0%</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
