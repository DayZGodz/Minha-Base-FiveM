<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GODZ BASE Connect</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Background Video: Data Nexus Loop -->
    <div class="video-background">
        <!-- Placeholder: Usuário deve substituir por 'assets/nexus_bg.webm' -->
        <video autoplay muted loop id="bg-video">
            <source src="assets/nexus_bg.webm" type="video/webm">
            <source src="https://cdn.pixabay.com/video/2019/04/20/22908-331663432_large.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
        <div class="scanlines"></div>
    </div>

    <!-- Main Interface -->
    <div class="container">
        
        <!-- Header Status -->
        <div class="system-header">
            <div class="sys-status">
                <span class="status-dot"></span> SYSTEM: ONLINE
            </div>
            <div class="sys-id">GODZ.NEXUS.V2</div>
        </div>

        <!-- Central Holographic AI -->
        <div class="nexus-core-container">
            <div class="hologram-ring outer-ring"></div>
            <div class="hologram-ring inner-ring"></div>
            
            <!-- AI Avatar Video Loop -->
            <div class="ai-avatar-wrapper">
                <video autoplay muted loop id="ai-avatar-video" class="ai-video">
                    <!-- Placeholder: Usuário deve substituir por 'assets/avatar_loop.webm' -->
                    <source src="assets/avatar_loop.webm" type="video/webm">
                    <source src="https://cdn.pixabay.com/video/2020/05/25/40149-424930030_large.mp4" type="video/mp4">
                </video>
                <!-- Audio Visualizer Overlay -->
                <div class="visualizer-overlay" id="visualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>

            <div class="ai-status-display">
                <p id="status-text">AGUARDANDO INPUT DE VOZ...</p>
            </div>
        </div>

        <!-- Interaction Module -->
        <div class="interaction-module">
            <button class="holo-mic-btn" id="mic-btn">
                <div class="mic-icon-wrapper">
                    <i class="fas fa-microphone"></i>
                </div>
                <div class="mic-ripple"></div>
            </button>
            <p class="instruction-text">CLIQUE PARA FALAR</p>
        </div>

        <!-- Info Data Stream (Left) -->
        <div class="data-stream-left">
            <div class="stream-header">/// PROTOCOLS</div>
            <ul class="data-list">
                <li>> AMOR_A_VIDA.exe ...... [ACTIVE]</li>
                <li>> NO_RDM_VDM.dll ....... [LOADED]</li>
                <li>> ROLEPLAY_CORE ........ [SYNCED]</li>
                <li>> DISCORD_LINK ......... [READY]</li>
            </ul>
        </div>

        <!-- Loading Bar (Bottom) -->
        <div class="loading-sector">
            <div class="loading-info">
                <span class="current-file" id="current-resource">INITIALIZING...</span>
                <span id="loading-percent">0%</span>
            </div>
            <div class="cyber-progress-bar">
                <div class="cyber-fill" id="progress-bar"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
