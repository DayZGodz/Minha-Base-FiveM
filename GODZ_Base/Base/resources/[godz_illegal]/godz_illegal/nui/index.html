<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GODZ Illegal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="app" class="hidden">
        <div class="panel">
            <div class="header">
                <h1 id="faction-name">Nome da Facção</h1>
                <div class="balance">
                    <span>Saldo da Organização</span>
                    <h2 id="faction-balance">$0</h2>
                </div>
                <button class="close-btn" onclick="closePanel()"><i class="fas fa-times"></i></button>
            </div>

            <div class="content-grid">
                <div class="card glass">
                    <h3><i class="fas fa-users"></i> Membros Online</h3>
                    <div class="list" id="members-list">
                        <!-- Members -->
                    </div>
                </div>

                <div class="card glass">
                    <h3><i class="fas fa-history"></i> Histórico de Operações</h3>
                    <div class="list" id="history-list">
                        <div class="item">
                            <span>Sistema de logs em breve...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
