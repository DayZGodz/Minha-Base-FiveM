<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GODZ Factions</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="container" style="display: none;">
        <header>
            <div class="logo">
                <h1>GODZ FACTIONS</h1>
                <span id="faction-name">CARREGANDO...</span>
            </div>
            <button class="close-btn" onclick="closeNUI()">ESC</button>
        </header>

        <main>
            <div class="stats-panel">
                <div class="stat-card">
                    <h3>Membros Online</h3>
                    <span id="online-count">0</span>
                </div>
                <div class="stat-card">
                    <h3>Saldo do Baú</h3>
                    <span id="chest-balance">$0</span>
                </div>
            </div>

            <div class="members-list">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="members-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
