<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>GODZ EMS</title>
</head>
<body>
    <div id="container" class="glass" style="display:none;">
        <div class="header">
            <img src="https://i.imgur.com/3p3F3dM.png" alt="EMS Logo" class="logo"> <!-- Placeholder logo -->
            <h2>Prontuário Médico</h2>
        </div>
        
        <div class="search-box">
            <input type="number" id="search-id" placeholder="ID do Paciente">
            <button onclick="searchPatient()">Buscar</button>
        </div>

        <div id="patient-info" class="hidden">
            <div class="info-card glass-light">
                <h3>Dados do Paciente</h3>
                <p><strong>Nome:</strong> <span id="p-name"></span></p>
                <p><strong>Idade:</strong> <span id="p-age"></span></p>
                <p><strong>Tipo Sanguíneo:</strong> <span id="p-blood" class="blood-tag"></span></p>
            </div>

            <div class="history-section glass-light">
                <h3>Histórico Recente</h3>
                <ul id="history-list">
                    <!-- Items -->
                </ul>
            </div>

            <div class="actions">
                <button class="btn-treat" onclick="finishTreatment()">Finalizar Tratamento (Alta)</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
