<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>GODZ Admin</title>
</head>
<body>
    <div id="container" class="glass" style="display:none;">
        <div class="sidebar glass-light">
            <div class="logo-area">
                <img src="https://i.imgur.com/3p3F3dM.png" alt="GODZ Logo">
                <h3>ADMIN</h3>
            </div>
            <button class="tab-btn active" onclick="switchTab('players')">👥 Jogadores</button>
            <button class="tab-btn" onclick="switchTab('items')">🎁 Itens/Veículos</button>
            <button class="tab-btn" onclick="switchTab('security')">🛡️ Segurança</button>
        </div>
        
        <div class="content">
            <!-- Players Tab -->
            <div id="tab-players" class="tab-content active">
                <div class="search-bar">
                    <input type="text" id="search-player" placeholder="Pesquisar jogador..." onkeyup="filterPlayers()">
                </div>
                <div class="player-list" id="player-list">
                    <!-- Player Items -->
                </div>
            </div>

            <!-- Items/Vehicles Tab -->
            <div id="tab-items" class="tab-content">
                <div class="form-group glass-light">
                    <h3>Dar Item</h3>
                    <input type="number" id="item-id" placeholder="ID do Jogador">
                    <input type="text" id="item-name" placeholder="Nome do Item (ex: celular)">
                    <input type="number" id="item-amount" placeholder="Quantidade">
                    <button class="action-btn" onclick="giveItem()">Enviar Item</button>
                </div>
                <div class="form-group glass-light">
                    <h3>Dar Veículo</h3>
                    <input type="number" id="veh-id" placeholder="ID do Jogador">
                    <input type="text" id="veh-name" placeholder="Nome do Veículo (ex: adder)">
                    <button class="action-btn" onclick="giveVehicle()">Adicionar Veículo</button>
                </div>
            </div>

            <!-- Security Tab -->
            <div id="tab-security" class="tab-content">
                <h3>Últimos Alertas (GODZ Shield)</h3>
                <div class="alert-list" id="alert-list">
                    <!-- Alerts -->
                </div>
                <button class="refresh-btn" onclick="loadAlerts()">Atualizar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
