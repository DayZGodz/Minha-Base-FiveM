<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>GODZ Interface</title>
</head>
<body>
  <div id="hud" class="hud">
    <div class="card">
      <div class="row"><span>Saúde</span><div class="bar"><div id="health" class="fill"></div></div></div>
      <div class="row"><span>Colete</span><div class="bar"><div id="armor" class="fill"></div></div></div>
      <div class="row"><span>Fome</span><div class="bar"><div id="hunger" class="fill"></div></div></div>
      <div class="row"><span>Sede</span><div class="bar"><div id="thirst" class="fill"></div></div></div>
      <div class="row"><span>Oxigênio</span><div class="bar"><div id="oxygen" class="fill"></div></div></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
